[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scio-lunch-order"
version = "0.1.0"
description = "Automates weekly school lunch ordering on the ASP.NET canteen site"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scio-lunch = "scio_lunch_order.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
